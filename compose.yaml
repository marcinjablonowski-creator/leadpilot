services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: leadpilot
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot -d leadpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://leadpilot:leadpilot@db:5432/leadpilot
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      SECURE_SSL_REDIRECT: "False"
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --access-logfile -
      --error-logfile -"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://leadpilot:leadpilot@db:5432/leadpilot
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      SECURE_SSL_REDIRECT: "False"
    command: celery -A config worker --loglevel=info
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
